name: Build and deploy website

on:
  push:
    branches: [main]

  workflow_dispatch:

  schedule:
    - cron: "23 14 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate articles with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          SOURCE_FEED_URL: ${{ vars.SOURCE_FEED_URL }}
          SOURCE_PERMISSION_CONFIRMED: ${{ vars.SOURCE_PERMISSION_CONFIRMED }}
          DAILY_LIMIT: ${{ vars.DAILY_LIMIT || '2' }}
        run: python scripts/generate.py


      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build website
        env:
          SITE_URL: https://mentalhealthadvocacynow.github.io
          BASE_PATH: /neurolaunch-daily
        run: npm run build

      - name: Save generated articles
        run: |
          git add src/content/articles data/processed.json

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add daily NeuroLaunch summaries"
            git push
          fi


      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
